[global]
workgroup = WORKGROUP
server string = Machinista
server min protocol = SMB2
map to guest = Never
load printers = no
printing = bsd
printcap name = /dev/null
disable spoolss = yes
interfaces = lo wlan0 eth0
bind interfaces only = yes
[Samples]
path = /home/machinista/Machinista/samples
valid users = machinista
force user = machinista
force group = machinista
read only = no
browseable = yes
create mask = 0644
directory mask = 0755
follow symlinks = no
wide links = no
