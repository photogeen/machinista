name: Bug report
description: Report reproducible Machinista behavior
body:
  - type: textarea
    id: environment
    attributes:
      label: Version and hardware
      description: Machinista version, Pi model, controller, interface and image edition. Omit serials and credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screen images
      description: Do not attach personal projects, ROMs, keys or Wi-Fi profiles.
